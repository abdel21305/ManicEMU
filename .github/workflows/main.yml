
name: Build ManicEMU IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-manicemu-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Install Git LFS
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull

      - name: Verify project
        run: |
          set -euo pipefail
          test -d "ManicEmu/ManicEmu.xcodeproj"
          xcodebuild \
            -list \
            -project "ManicEmu/ManicEmu.xcodeproj"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "ManicEmu/ManicEmu.xcodeproj" \
            -scheme "ManicEmuSideload"

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project "ManicEmu/ManicEmu.xcodeproj" \
            -scheme "ManicEmuSideload" \
            -configuration "SideloadRelease" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/SideloadRelease-iphoneos/ManicEmu.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: ManicEmu.app introuvable."
            find "$GITHUB_WORKSPACE/build/Build/Products" \
              -maxdepth 4 -name "*.app" -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"
          /usr/bin/zip -qry \
            "$GITHUB_WORKSPACE/ManicEmu-unsigned.ipa" \
            Payload

          test -s "$GITHUB_WORKSPACE/ManicEmu-unsigned.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ManicEmu-unsigned-IPA
          path: ManicEmu-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ManicEmu-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
