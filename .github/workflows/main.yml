name: Build ManicEMU IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ManicEmu/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project ManicEmu/ManicEmu.xcodeproj

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ManicEmu.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r ManicEMU-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ManicEMU-unsigned-IPA
          path: ManicEMU-unsigned.ipa
          if-no-files-found: error
