
name: Build ManicEMU IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ManicEmu/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: xcodebuild -version

      - name: List project schemes
        run: |
          xcodebuild -list \
            -project ManicEmu/ManicEmu.xcodeproj

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products \
            -type d \
            -name 'ManicEmu.app' \
            -path '*iphoneos*' \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ManicEmu.app introuvable"
            find build/Build/Products -maxdepth 3 -type d
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r ManicEMU-unsigned.ipa Payload
          test -f ManicEMU-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ManicEMU-unsigned-IPA
          path: ManicEMU-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
